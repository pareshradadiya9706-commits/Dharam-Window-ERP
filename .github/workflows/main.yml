name: Build Dharam Window ERP APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Regenerate gradlew
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew
          ls -lh ./gradlew gradle/wrapper/

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache -Djava.awt.headless=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dharam-Window-ERP-APK
          path: app/build/outputs/apk/debug/*.apk
