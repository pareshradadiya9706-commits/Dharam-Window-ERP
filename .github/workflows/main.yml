name: Build Dharam Window ERP APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Regenerate Gradle Wrapper 9.3.1
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Djava.awt.headless=true \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dharam-Window-ERP-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
